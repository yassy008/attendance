<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出席確認</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html"><span class="brand-mark">出</span>出席確認</a>
      <span id="authbar" style="margin-left:auto"></span>
    </div>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>授業一覧</h1>
        <div class="muted">授業を選んで、教員モード・学生画面・出席簿を開きます</div>
      </div>
      <button type="button" class="btn" id="open-create">＋ 新しい授業を作成</button>
    </div>

    <div class="page-head" style="align-items: center">
      <div class="segmented sort-tabs">
        <button type="button" data-sort="slot">時間割順</button>
        <button type="button" data-sort="access">最終アクセス順</button>
        <button type="button" data-sort="created">作成日順</button>
      </div>
      <select id="filter-term" style="width: auto"></select>
    </div>

    <div id="course-list" class="course-grid"></div>

    <section class="panel" id="create-panel" style="margin-top: 22px" hidden>
      <h2>新しい授業を作成</h2>
      <form id="create-form" autocomplete="off">
        <div class="create-grid">
          <div>
            <div class="field">
              <label for="c-title">授業名 *</label>
              <input type="text" id="c-title" name="title" placeholder="例: 英語科指導法 I" required>
            </div>
            <div class="field">
              <label for="c-room">教室名（任意）</label>
              <input type="text" id="c-room" name="roomName" placeholder="例: DN301">
            </div>
            <div class="field-row">
              <div class="field"><label for="c-year">年度</label><input type="number" id="c-year" name="year" min="2020" max="2100"></div>
              <div class="field"><label for="c-term">学期</label><select id="c-term" name="term"></select></div>
              <div class="field"><label for="c-day">曜日</label><select id="c-day" name="day"></select></div>
              <div class="field"><label for="c-period">時限</label><select id="c-period" name="period"></select></div>
            </div>
            <div class="field-row">
              <div class="field"><label for="c-cols">座席の列数（横）</label><select id="c-cols" name="cols"></select></div>
              <div class="field"><label for="c-rows">座席の行数（縦）</label><select id="c-rows" name="rows"></select></div>
            </div>
            <p class="hint" style="margin: -6px 0 16px">列数・行数、通路、使えない席は作成後にも変更できます</p>
            <button type="submit" class="btn btn-lg">この内容で作成</button>
          </div>
          <div>
            <span class="label">座席のプレビュー</span>
            <div class="preview-box"><div id="preview"></div></div>
          </div>
        </div>
      </form>
    </section>

    <aside class="note">
      <ul>
        <li>作成すると、学生用のURLとQRコードが自動で作られます。</li>
        <li>名簿（学籍番号・氏名）を読み込むと座席を指定できます。シャッフルやグループ分けもできます。</li>
        <li>出席記録は日付ごとに保存され、「出席簿」で学期全体を確認できます。</li>
      </ul>
    </aside>
  </main>

  <script type="module" src="js/top.js"></script>
</body>
</html>
